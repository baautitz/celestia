# Traefik SÓ PARA DESENVOLVIMENTO (ver docker-compose.cert.yaml e docs/conventions/device-certificates.md).
# Reproduz o que o Traefik de produção faz no endereço `acesso.`: exige um certificado de cliente assinado pela CA
# do Celestia, repassa o certificado ao app em X-Forwarded-Tls-Client-Cert e acrescenta o segredo do proxy.
# O certificado do site é o padrão (autoassinado) do Traefik: o navegador avisa uma vez, é só continuar.
tls:
  options:
    default:
      clientAuth:
        caFiles:
          - /certs/ca.crt
        clientAuthType: RequireAndVerifyClientCert

http:
  middlewares:
    # Repassa o certificado validado. O Traefik descarta qualquer X-Forwarded-Tls-Client-Cert enviado pelo cliente.
    client-cert:
      passTLSClientCert:
        pem: true
    # O app só aceita o certificado repassado se vier com este segredo. Sobrescreve o que o cliente mandar.
    proxy-secret:
      headers:
        customRequestHeaders:
          X-Celestia-Proxy-Secret: '{{ env "PROXY_SHARED_SECRET" }}'

  routers:
    acesso:
      rule: "Host(`localhost`)"
      entryPoints:
        - websecure
      service: app
      middlewares:
        - client-cert
        - proxy-secret
      tls: {}

  services:
    app:
      loadBalancer:
        servers:
          - url: '{{ env "CERT_UPSTREAM" }}'
