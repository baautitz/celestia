packages:
  - packages/*
  - integrations/*
  - services/*

catalog:
  "@base-ui/react": "^1.9.0"
  "@hono/node-server": "^2.0.0"
  "@hono/zod-validator": "^0.9.1"
  "@hookform/resolvers": "^7.0.0"
  "@testing-library/react": "^16.3.3"
  "@types/node": "^26.0.0"
  "@types/pg": "^8.23.1"
  "@types/react": "^19.3.0"
  "@types/react-dom": "^19.3.0"
  "drizzle-kit": "1.0.0-rc.4"
  "drizzle-orm": "1.0.0-rc.4"
  "exceljs": "^4.4.0"
  "hono": "^4.13.19"
  "jsdom": "^31.0.0"
  "lucide-react": "^1.75.0"
  "pg": "^8.23.1"
  "pino": "^10.4.0"
  "react": "^19.3.1"
  "react-dom": "^19.3.1"
  "react-hook-form": "^7.92.0"
  "react-router-dom": "^7.0.0"
  "tsx": "^4.23.15"
  "typescript": "^7.0.2"
  "vitest": "^5.1.1"
  "zod": "^4.6.7"

# esbuild (via tsx, drizzle-kit) is the only dependency whose install script is needed (it validates/links the platform binary).
allowBuilds:
  esbuild: true

# drizzle-orm declara peer mssql ^11, mas o ERP usa o driver mssql 12 diretamente (sem passar pelo drizzle).
peerDependencyRules:
  allowedVersions:
    mssql: "*"
    "@types/mssql": "*"

permissions:
  drizzle-kit:
    skills: true
