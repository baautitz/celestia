# Traefik SÓ PARA DESENVOLVIMENTO: testa o login por certificado de Dispositivo de verdade, no navegador.
# Em produção o Traefik é o do Dokploy, configurado separadamente (ver docs/conventions/device-certificates.md).
#
# Uso (com CA_CERT_SOURCE=header, CA_PROXY_SECRET e CA_PUBLIC_URL=https://acesso.localhost:8443 no .env, e a CA criada
# com `pnpm create-ca`):
#   docker compose -f docker-compose.cert.yaml up          # sobe o Traefik em https://acesso.localhost:8443
#   pnpm dev                                               # backend, autoridade certificadora e Vite, como sempre
# O app continua em http://localhost:5173: só a leitura do certificado passa pelo Traefik, que exige o certificado do
# Dispositivo (instale o .pfx no navegador). O banco continua sendo o do docker-compose.yml.
#
# O Traefik usa a rede do host (só Linux) para alcançar a CA em localhost:3001 sem expô-la na rede.
# Escuta nos dois loopbacks (IPv4 e IPv6) porque o navegador resolve `acesso.localhost` para qualquer um dos dois.
services:
  traefik:
    image: traefik:v3.1
    restart: unless-stopped
    network_mode: host
    command:
      - --entrypoints.websecure.address=127.0.0.1:8443
      - --entrypoints.websecure6.address=[::1]:8443
      - --providers.file.filename=/etc/traefik/dynamic.yml
      - --providers.file.watch=true
      - --log.level=INFO
    environment:
      CA_PROXY_SECRET: ${CA_PROXY_SECRET:?defina CA_PROXY_SECRET no .env (mínimo 32 caracteres)}
      CERT_UPSTREAM: ${CERT_UPSTREAM:-http://localhost:3001}
    volumes:
      - ./dev/traefik/dynamic.yml:/etc/traefik/dynamic.yml:ro
      # Só o certificado público da CA entra no Traefik; a chave fica onde o app a lê.
      - ${DEVICE_CA_CERT_FILE:?defina DEVICE_CA_CERT_FILE no .env}:/certs/ca.crt:ro
